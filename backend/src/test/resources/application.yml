spring:
  datasource:
    url: jdbc:h2:mem:pokemon-collection-test;MODE=LEGACY;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  main:
    banner-mode: "off"
logging:
