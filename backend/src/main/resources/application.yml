spring:
  application:
    name: pokemon-collection
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/pokemon-collection.h2.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.pokemoncollection: INFO

pokeapi:
  base-url: https://pokeapi.co/api/v2

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:cG9rZW1vbi1jb2xsZWN0aW9uLXRlc3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
    expiration-time: ${JWT_EXPIRATION_TIME:300000}
